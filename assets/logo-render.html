<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b0b0e; overflow: hidden; }
  .board {
    display: none;
    align-items: center;
    justify-content: center;
    background: #0b0b0e;
    font-family: "Space Grotesk", sans-serif;
  }
  .board.active { display: flex; }

  /* 600x600 — icon only (lime ring, like the favicon) */
  #icon { width: 600px; height: 600px; }
  #icon .ring {
    width: 280px; height: 280px;
    border: 36px solid #d7ff3f;
    border-radius: 50%;
  }

  /* 600x600 — ring + wordmark stacked */
  #square { width: 600px; height: 600px; flex-direction: column; gap: 52px; }
  #square .ring {
    width: 150px; height: 150px;
    border: 20px solid #d7ff3f;
    border-radius: 50%;
  }
  #square .word {
    color: #edede6;
    font-weight: 700;
    font-size: 120px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .word sup { color: #d7ff3f; font-size: 0.32em; vertical-align: 1.45em; }

  /* 1200x300 — landscape wordmark */
  #landscape { width: 1200px; height: 300px; gap: 36px; }
  #landscape .ring {
    width: 110px; height: 110px;
    border: 15px solid #d7ff3f;
    border-radius: 50%;
  }
  #landscape .word {
    color: #edede6;
    font-weight: 700;
    font-size: 170px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="board" id="icon"><div class="ring"></div></div>
  <div class="board" id="square">
    <div class="ring"></div>
    <div class="word">OTTO<sup>®</sup></div>
  </div>
  <div class="board" id="landscape">
    <div class="ring"></div>
    <div class="word">OTTO<sup>®</sup></div>
  </div>
  <script>
    const v = new URLSearchParams(location.search).get("v") || "icon";
    document.getElementById(v).classList.add("active");
  </script>
</body>
</html>
